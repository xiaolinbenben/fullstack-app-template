name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_PATH: /opt/fullstack-app-template
      SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Upload deployment files
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SERVER_USER@$SERVER_HOST" "mkdir -p '$DEPLOY_PATH/deploy'"
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            deploy/docker-compose.yml deploy/.env.example \
            "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/deploy/"

      - name: Pull and restart application
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "$SERVER_USER@$SERVER_HOST" \
            "cd '$DEPLOY_PATH' && test -f deploy/.env && docker compose --env-file deploy/.env -f deploy/docker-compose.yml pull && docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --remove-orphans && docker compose --env-file deploy/.env -f deploy/docker-compose.yml ps"
